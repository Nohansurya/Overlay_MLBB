<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - MLBB Overlay</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #2c3e50; color: white; }
        .box { background: #34495e; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #e74c3c; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Control Panel</h2>
        <label>Nama Tim Kiri:</label>
        <input type="text" id="timKiri" placeholder="Contoh: RRQ">
        
        <label>Nama Tim Kanan:</label>
        <input type="text" id="timKanan" placeholder="Contoh: EVOS">
        
        <button onclick="kirimData()">UPDATE OVERLAY</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function kirimData() {
            const data = {
                timKiri: document.getElementById('timKiri').value,
                timKanan: document.getElementById('timKanan').value
            };
            socket.emit('update_overlay', data);
        }
    </script>
</body>
</html>
