<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - MLBB Overlay</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="box-team">
        <h2>Logo & Team Panel</h2>
        <label for="logo-kiri">Pilih Tim Kiri:</label>
        <select id="logo-kiri">
            <option value="">-- Pilih Logo --</option>
        </select>

        <label for="logo-kanan">Pilih Tim Kanan:</label>
        <select id="logo-kanan">
            <option value="">-- Pilih Logo --</option>
        </select>
    </div>

    <div class="box-team" style="margin-top: 20px;">
        <h2>Caster Panel</h2>
        <label for="input-caster">Nama Caster:</label>
        <input type="text" id="input-caster" placeholder="Contoh: Adi - Udin" autocomplete="off">
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    
    const dropdowns = {
        kiri: document.getElementById('logo-kiri'),
        kanan: document.getElementById('logo-kanan')
    };
    const inputCaster = document.getElementById('input-caster');

    socket.on('daftar_logo', (daftarLogo) => {
        Object.values(dropdowns).forEach(selectElement => {
            selectElement.innerHTML = '<option value="">-- Pilih Logo --</option>';
            
            daftarLogo.forEach(namaFile => {
                const option = document.createElement('option');
                option.value = `/assets/LOGO TIM/${namaFile}`;
                option.textContent = namaFile.split('.')[0];
                selectElement.appendChild(option);
            });
        });
    });

    function handleLogoChange(sisi, element) {
        element.addEventListener('change', () => {
            const namaTimTerpilih = element.options[element.selectedIndex].text;
            const pathLogoTerpilih = element.value;
            const namaTim = pathLogoTerpilih ? namaTimTerpilih : "";

            if (sisi === 'kiri') {
                socket.emit('update_overlay', {
                    logoKiri: pathLogoTerpilih,
                    namaTimKiri: namaTim
                });
            } else if (sisi === 'kanan') {
                socket.emit('update_overlay', {
                    logoKanan: pathLogoTerpilih,
                    namaTimKanan: namaTim
                });
            }
        });
    }
    handleLogoChange('kiri', dropdowns.kiri);
    handleLogoChange('kanan', dropdowns.kanan);

    inputCaster.addEventListener('input', () => {
        socket.emit('update_overlay', {
            caster: inputCaster.value
        });
    });
</script>
</body>
</html>
