<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Panel - MLBB Overlay</title>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="dashboard-wrapper">
      <h1 class="page-title">MLBB OVERLAY CONTROL PANEL</h1>

      <!-- ==========================================
           SECTION 1: OVERLAY UTAMA (IN-GAME & DRAFT)
           ========================================== -->
      <div class="section-block">
        <h2 class="section-header">1. Kontrol Overlay Utama</h2>

        <div class="grid-4">
          <!-- Panel Tim -->
          <div class="box">
            <h2>Logo & Team Panel</h2>
            <label for="logo-kiri">Pilih Tim Kiri:</label>
            <select id="logo-kiri">
              <option value="">-- Pilih Logo --</option>
            </select>
            <label for="logo-kanan">Pilih Tim Kanan:</label>
            <select id="logo-kanan">
              <option value="">-- Pilih Logo --</option>
            </select>
          </div>

          <!-- Panel Match Control -->
          <div class="box">
            <h2>Match Control</h2>
            <label for="input-match">Keterangan Match:</label>
            <input
              type="text"
              id="input-match"
              placeholder="Contoh: Match 1 / Game 1"
              autocomplete="off"
            />
            <label for="input-stage">Jenis Stage:</label>
            <input
              type="text"
              id="input-stage"
              placeholder="Contoh: Group Stage A"
              autocomplete="off"
            />
          </div>

          <!-- Panel Poin Game -->
          <div class="box">
            <h2>Poin Game</h2>
            <label for="select-bo">Kategori Match (BO):</label>
            <select id="select-bo">
              <option value="1">Best of 1</option>
              <option value="3">Best of 3</option>
              <option value="5">Best of 5</option>
              <option value="7">Best of 7</option>
            </select>
            <div class="score-container">
              <div class="score-team">
                <label>Poin Tim Kiri</label>
                <div id="check-kiri" class="checkbox-group"></div>
              </div>
              <div class="score-team">
                <label>Poin Tim Kanan</label>
                <div id="check-kanan" class="checkbox-group"></div>
              </div>
            </div>
          </div>

          <!-- Panel Caster -->
          <div class="box">
            <h2>Caster Panel</h2>
            <label for="input-caster">Nama Caster:</label>
            <input
              type="text"
              id="input-caster"
              placeholder="Contoh: Adi - Udin"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Tombol Update Khusus Section Utama -->
        <button id="btn-update" class="btn-main-update">
          KIRIM KE OVERLAY UTAMA
        </button>
      </div>

      <!-- ==========================================
           SECTION 2: PRE-MATCH COUNTDOWN
           ========================================== -->
      <div class="section-block">
        <h2 class="section-header">2. Kontrol Countdown Pre-Match</h2>

        <div class="box flex-row-center">
          <div class="input-group-inline">
            <label for="input-menit">Menit:</label>
            <input
              type="number"
              id="input-menit"
              placeholder="0"
              value="5"
              min="0"
            />
          </div>
          <div class="input-group-inline">
            <label for="input-detik">Detik:</label>
            <input
              type="number"
              id="input-detik"
              placeholder="0"
              value="0"
              min="0"
              max="59"
            />
          </div>
          <div class="btn-group-inline">
            <button id="btn-start-timer" class="btn-start">
              MULAI COUNTDOWN
            </button>
            <button id="btn-stop-timer" class="btn-stop">STOP / RESET</button>
          </div>
        </div>
      </div>

      <!-- ==========================================
           SECTION 3: PRE-MATCH SCHEDULE
           ========================================== -->
      <div class="section-block">
        <h2 class="section-header">
          3. Jadwal & Hasil Pertandingan (Pre-Match)
        </h2>

        <div class="schedule-flex">
          <!-- Match 1 -->
          <div class="schedule-item box">
            <h3>Match 1</h3>
            <select id="pm-logo-kiri-1">
              <option value="">-- Logo Tim Kiri --</option>
            </select>
            <input
              type="number"
              id="pm-score-kiri-1"
              placeholder="Score Kiri"
              value="0"
              min="0"
            />
            <select id="pm-logo-kanan-1">
              <option value="">-- Logo Tim Kanan --</option>
            </select>
            <input
              type="number"
              id="pm-score-kanan-1"
              placeholder="Score Kanan"
              value="0"
              min="0"
            />
            <select id="pm-bo-1">
              <option value="BO1">Best of 1</option>
              <option value="BO3">Best of 3</option>
              <option value="BO5">Best of 5</option>
              <option value="BO7">Best of 7</option>
            </select>
          </div>

          <!-- Match 2 -->
          <div class="schedule-item box">
            <h3>Match 2</h3>
            <select id="pm-logo-kiri-2">
              <option value="">-- Logo Tim Kiri --</option>
            </select>
            <input
              type="number"
              id="pm-score-kiri-2"
              placeholder="Score Kiri"
              value="0"
              min="0"
            />
            <select id="pm-logo-kanan-2">
              <option value="">-- Logo Tim Kanan --</option>
            </select>
            <input
              type="number"
              id="pm-score-kanan-2"
              placeholder="Score Kanan"
              value="0"
              min="0"
            />
            <select id="pm-bo-2">
              <option value="BO1">Best of 1</option>
              <option value="BO3">Best of 3</option>
              <option value="BO5">Best of 5</option>
              <option value="BO7">Best of 7</option>
            </select>
          </div>

          <!-- Match 3 -->
          <div class="schedule-item box">
            <h3>Match 3</h3>
            <select id="pm-logo-kiri-3">
              <option value="">-- Logo Tim Kiri --</option>
            </select>
            <input
              type="number"
              id="pm-score-kiri-3"
              placeholder="Score Kiri"
              value="0"
              min="0"
            />
            <select id="pm-logo-kanan-3">
              <option value="">-- Logo Tim Kanan --</option>
            </select>
            <input
              type="number"
              id="pm-score-kanan-3"
              placeholder="Score Kanan"
              value="0"
              min="0"
            />
            <select id="pm-bo-3">
              <option value="BO1">Best of 1</option>
              <option value="BO3">Best of 3</option>
              <option value="BO5">Best of 5</option>
              <option value="BO7">Best of 7</option>
            </select>
          </div>
        </div>

        <button id="btn-update-schedule" class="btn-schedule-update">
          KIRIM JADWAL KE LAYAR PRE-MATCH
        </button>
      </div>
    </div>

    <!-- Script Node.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const dropdowns = {
        kiri: document.getElementById("logo-kiri"),
        kanan: document.getElementById("logo-kanan"),
        pmKiri1: document.getElementById("pm-logo-kiri-1"),
        pmKanan1: document.getElementById("pm-logo-kanan-1"),
        pmKiri2: document.getElementById("pm-logo-kiri-2"),
        pmKanan2: document.getElementById("pm-logo-kanan-2"),
        pmKiri3: document.getElementById("pm-logo-kiri-3"),
        pmKanan3: document.getElementById("pm-logo-kanan-3"),
      };

      const inputCaster = document.getElementById("input-caster");
      const inputMatch = document.getElementById("input-match");
      const inputStage = document.getElementById("input-stage");
      const selectBo = document.getElementById("select-bo");
      const checkKiriContainer = document.getElementById("check-kiri");
      const checkKananContainer = document.getElementById("check-kanan");
      const btnUpdate = document.getElementById("btn-update");

      socket.on("daftar_logo", (daftarLogo) => {
        Object.values(dropdowns).forEach((selectElement) => {
          selectElement.innerHTML =
            '<option value="">-- Pilih Logo --</option>';
          daftarLogo.forEach((namaFile) => {
            const option = document.createElement("option");
            option.value = `/assets/LOGO TIM/${namaFile}`;
            option.textContent = namaFile.split(".")[0];
            selectElement.appendChild(option);
          });
        });
      });

      function renderCheckboxes() {
        const boValue = parseInt(selectBo.value);
        let maxPoin = 1;
        if (boValue === 3) maxPoin = 2;
        if (boValue === 5) maxPoin = 3;
        if (boValue === 7) maxPoin = 4;

        function buatCheck(container) {
          container.innerHTML = "";
          for (let i = 0; i < maxPoin; i++) {
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.className = "cb-poin";
            container.appendChild(cb);
          }
        }
        buatCheck(checkKiriContainer);
        buatCheck(checkKananContainer);
      }

      selectBo.addEventListener("change", renderCheckboxes);
      renderCheckboxes();

      // FUNGSI 1: KIRIM OVERLAY UTAMA
      btnUpdate.addEventListener("click", () => {
        const timKiri = dropdowns.kiri;
        const timKanan = dropdowns.kanan;
        const namaTimKiri = timKiri.value
          ? timKiri.options[timKiri.selectedIndex].text
          : "";
        const namaTimKanan = timKanan.value
          ? timKanan.options[timKanan.selectedIndex].text
          : "";

        const skorKiri = document.querySelectorAll(
          "#check-kiri input:checked",
        ).length;
        const skorKanan = document.querySelectorAll(
          "#check-kanan input:checked",
        ).length;
        const boActive = selectBo.value;
        const poinFile = `assets/poin/${skorKiri}-${skorKanan}(${boActive}).png`;

        socket.emit("update_overlay", {
          logoKiri: timKiri.value,
          namaTimKiri: namaTimKiri,
          logoKanan: timKanan.value,
          namaTimKanan: namaTimKanan,
          caster: inputCaster.value,
          matchText: inputMatch.value,
          stageText: inputStage.value,
          poinImage: poinFile,
          boValue: boActive,
        });

        alert("Data Overlay Utama (In-Game & Draft) berhasil dikirim!");
      });

      // FUNGSI 2: COUNTDOWN
      const inputMenit = document.getElementById("input-menit");
      const inputDetik = document.getElementById("input-detik");
      const btnStartTimer = document.getElementById("btn-start-timer");
      const btnStopTimer = document.getElementById("btn-stop-timer");

      btnStartTimer.addEventListener("click", () => {
        const menit = parseInt(inputMenit.value) || 0;
        const detik = parseInt(inputDetik.value) || 0;
        const totalMs = (menit * 60 + detik) * 1000;
        const targetTime = Date.now() + totalMs;

        socket.emit("update_overlay", {
          targetWaktu: targetTime,
          isTimerActive: true,
        });
      });

      btnStopTimer.addEventListener("click", () => {
        socket.emit("update_overlay", {
          isTimerActive: false,
        });
      });

      // FUNGSI 3: SCHEDULE PRE-MATCH
      document
        .getElementById("btn-update-schedule")
        .addEventListener("click", () => {
          const matches = [];
          for (let i = 1; i <= 3; i++) {
            matches.push({
              logoKiri: document.getElementById(`pm-logo-kiri-${i}`).value,
              scoreKiri: document.getElementById(`pm-score-kiri-${i}`).value,
              logoKanan: document.getElementById(`pm-logo-kanan-${i}`).value,
              scoreKanan: document.getElementById(`pm-score-kanan-${i}`).value,
              bo: document.getElementById(`pm-bo-${i}`).value,
            });
          }

          socket.emit("update_overlay", {
            prematchSchedule: matches,
          });

          alert("Jadwal Pre-Match berhasil dikirim!");
        });
    </script>
  </body>
</html>
