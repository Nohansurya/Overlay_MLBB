<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Draft Pick Overlay</title>
    <link rel="stylesheet" href="css/draft-pick.css" />
  </head>
  <body>
    <!-- LAYER 1: BACKGROUND DRAFT PICK -->
    <img
      id="BgDraft"
      src="assets/Draft-Pick Overlay(1).png"
      class="background-overlay"
      alt="Background Draft Pick"
    />

    <!-- LAYER 2: SISTEM POIN DRAFT PICK -->
    <img
      id="PoinGambarDraft"
      src="assets/poin-draft/0-0(1).png"
      class="points-overlay"
      alt="Score Points Draft"
    />

    <!-- LAYER 3: TEKS DINAMIS -->
    <div class="data-container">
      <div class="teksTim" id="teksTimKiri">TIM A</div>
      <div class="teksTim" id="teksTimKanan">TIM B</div>

      <div id="MatchText">MATCH 1</div>
      <div id="StageText">GROUP STAGE A</div>

      <!-- ELEMEN BARU: Caster -->
      <div id="Caster">Adi - Udin</div>
    </div>

    <!-- Script Node.js / Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      // Elemen DOM Teks
      const teksMatch = document.getElementById("MatchText");
      const teksStage = document.getElementById("StageText");
      const imgPoinDraft = document.getElementById("PoinGambarDraft");
      const teksKiri = document.getElementById("teksTimKiri");
      const teksKanan = document.getElementById("teksTimKanan");

      // ELEMEN DOM BARU: Caster
      const teksCaster = document.getElementById("Caster");

      socket.on("terima_data", (data) => {
        console.log("Data Draft Pick Diterima:", data);

        // Update Background BO
        if (data.boValue !== undefined) {
          document.getElementById("BgDraft").src =
            `assets/Draft-Pick Overlay(${data.boValue}).png`;
        }

        // Update Nama Tim Kiri dan Kanan
        if (data.namaTimKiri !== undefined)
          teksKiri.innerText = data.namaTimKiri;
        if (data.namaTimKanan !== undefined)
          teksKanan.innerText = data.namaTimKanan;

        // Update Match dan Stage
        if (data.matchText !== undefined) teksMatch.innerText = data.matchText;
        if (data.stageText !== undefined) teksStage.innerText = data.stageText;

        // UPDATE BARU: Caster
        if (data.caster !== undefined) teksCaster.innerText = data.caster;

        // Manipulasi direktori gambar poin
        if (data.poinImage !== undefined) {
          const pathDraft = data.poinImage.replace(
            "assets/poin/",
            "assets/poin-draft/",
          );
          imgPoinDraft.src = pathDraft;
        }
      });
    </script>
  </body>
</html>
