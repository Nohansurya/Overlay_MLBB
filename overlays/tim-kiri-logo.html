<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Logo Tim Kiri</title>
    <style>
        html, body { 
            background: transparent; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            /* Memaksa halaman membungkus area konten saja agar pas di OBS */
            width: max-content;
            height: max-content;
        }

        /* Kandang pembatas otomatis untuk ukuran logo */
        .logo-box {
            width: 100px;  
            height: 100px; 
            display: flex;
            align-items: center;     
            justify-content: center; 
        }

        .logo-box img { 
            width: 100%;
            height: 100%;
            object-fit: contain; /* Menjaga logo agar TIDAK gepeng */
            display: block;
        }
    </style>
</head>
<body>

    <!-- Membungkus logo dengan kontainer box yang aman -->
    <div class="logo-box">
        <img id="logoTimKiri" src="/assets/logo-kiri.jpg" alt="Logo Kiri" />
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const imgLogoKiri = document.getElementById("logoTimKiri");

      socket.on("terima_data", (data) => {
        if (data.logoKiri !== undefined) imgLogoKiri.src = data.logoKiri;
      });
    </script>
</body>
</html>
