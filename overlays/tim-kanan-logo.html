<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Logo Tim Kanan</title>
    <style>
        @font-face {
        font-family: "Demarus";
        src: url("assets/fonts/DEMARUS.otf");
        }
        body { background: transparent; margin: 0; padding: 0; overflow: hidden;
        font-family: "Demarus", sans-serif; font-size: 40px; 
            font-weight: 600; 
            color: white; 
            display: inline-block;}
    </style>
</head>
<body>
    <img id="logoTimKanan" src="/assets/logo-kanan.jpeg" alt="Logo Kanan" />

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const imgLogoKanan = document.getElementById("logoTimKanan");

      socket.on("terima_data", (data) => {
        if (data.logoKanan !== undefined) imgLogoKanan.src = data.logoKanan;
      });
    </script>
</body>
</html>
