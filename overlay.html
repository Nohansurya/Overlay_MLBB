<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Overlay Tampilan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/overlay.css" />
  </head>
  <body>
    <!-- LAYER 1: BACKGROUND (Ganti dengan <img> jika pakai .webp, atau <video> jika pakai .webm) -->
    <img
      src="assets/In-Game Overlay.png"
      class="background-overlay"
      alt="Background"
    />

    <!-- JIKA PAKAI WEBM, gunakan kode ini dan hapus kode <img> di atas: 
    <video src="assets/In-Game Overlay.webm" class="background-overlay" autoplay loop muted></video> 
    -->

    <!-- LAYER 2: TEKS & LOGO DINAMIS -->
    <div class="data-container">
      <!-- Menggunakan ID bawaan untuk update logo tim secara real-time -->
      <img id="logoTimKiri" src="assets/logo-kiri.jpg" alt="Logo Kiri" />
      <div class="teksTim" id="teksTimKiri"><p>TIM A</p></div>
      
      <img id="logoTimKanan" src="assets/logo-kanan.jpeg" alt="Logo Kanan" />
      <div class="teksTim" id="teksTimKanan"><p>TIM B</p></div>
      
      <div id="Caster">Adi - Udin</div>
    </div>

    <!-- Script Node.js -->
    <script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Elemen DOM Teks & Caster
  const teksKiri = document.getElementById("teksTimKiri");
  const teksKanan = document.getElementById("teksTimKanan");
  const teksCaster = document.getElementById("Caster");
  
  // Elemen DOM Logo
  const imgLogoKiri = document.getElementById("logoTimKiri");
  const imgLogoKanan = document.getElementById("logoTimKanan");

  socket.on("terima_data", (data) => {
    console.log("Data Update Diterima:", data);

    // Update teks nama tim
    if (data.namaTimKiri !== undefined) teksKiri.innerText = data.namaTimKiri;
    if (data.namaTimKanan !== undefined) teksKanan.innerText = data.namaTimKanan;

    // Update source gambar logo
    if (data.logoKiri !== undefined) imgLogoKiri.src = data.logoKiri;
    if (data.logoKanan !== undefined) imgLogoKanan.src = data.logoKanan;

    // LOGIKA BARU: Update teks Caster secara real-time
    if (data.caster !== undefined) {
        teksCaster.innerText = data.caster;
    }
  });
</script>
  </body>
</html>
